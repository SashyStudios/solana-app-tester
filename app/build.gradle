import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.clockin.mwatestapp'
    compileSdk 37

    defaultConfig {
        applicationId "com.clockin.mwatestapp"
        minSdk 27
        targetSdk 37
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_11
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    // Supplies ComponentActivity's by viewModels() delegate - classic Views, no Compose.
    implementation 'androidx.activity:activity-ktx:1.13.0'

    // Mobile Wallet Adapter + Solana transaction building/RPC (devnet only - see SolanaConfig).
    implementation 'com.solanamobile:mobile-wallet-adapter-clientlib-ktx:2.2.0'
    implementation 'com.solanamobile:rpc-core:0.2.11'
    implementation 'com.solanamobile:rpc-solana:0.2.11'
    implementation 'com.solanamobile:rpc-ktordriver:0.2.11'

    // Base58 encoding for displaying the devnet transaction signature.
    implementation 'org.bitcoinj:bitcoinj-core:0.17.1'
}
