import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.clockin.apptester'
    compileSdk 37

    defaultConfig {
        applicationId "com.clockin.apptester"
        minSdk 27
        targetSdk 37
        versionCode 1
        versionName "1.0"
    }

    // Release signing. Only the property NAMES live here; the values come from the
    // user-level gradle.properties (~/.gradle/gradle.properties). Missing properties only
    // fail when a release build is actually requested, so debug builds and a fresh clone
    // still work without a keystore.
    def sashyProps = ['SASHY_KEYSTORE_FILE', 'SASHY_KEYSTORE_PASSWORD',
                      'SASHY_KEY_ALIAS', 'SASHY_KEY_PASSWORD']
    def missingSashyProps = sashyProps.findAll { !project.hasProperty(it) }
    def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
    if (releaseRequested && !missingSashyProps.isEmpty()) {
        throw new GradleException("Release signing is not configured. Missing Gradle " +
                "properties: ${missingSashyProps.join(', ')}. Define them in your user-level " +
                "gradle.properties (see 'Building a release APK' in README.md).")
    }

    signingConfigs {
        release {
            if (missingSashyProps.isEmpty()) {
                storeFile file(project.property('SASHY_KEYSTORE_FILE'))
                storePassword project.property('SASHY_KEYSTORE_PASSWORD')
                keyAlias project.property('SASHY_KEY_ALIAS')
                keyPassword project.property('SASHY_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (missingSashyProps.isEmpty()) {
                signingConfig signingConfigs.release
            }
            // Minification and resource shrinking stay OFF so the accessibility service
            // and Solana code behave exactly like debug.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_11
        }
    }

    buildFeatures {
        compose true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'

    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Mobile Wallet Adapter + Solana transaction building/RPC, same versions the demo app
    // uses (see app/build.gradle) so both modules behave identically against a wallet.
    // Devnet only - see solana/DevnetConfig.kt, which enforces it rather than documenting it.
    // Stage 1 is connect-only: the rpc-* artifacts are unused until the signing stage.
    implementation 'com.solanamobile:mobile-wallet-adapter-clientlib-ktx:2.2.0'
    implementation 'com.solanamobile:rpc-core:0.2.11'
    implementation 'com.solanamobile:rpc-solana:0.2.11'
    implementation 'com.solanamobile:rpc-ktordriver:0.2.11'

    // Base58 encoding for displaying the connected wallet address.
    implementation 'org.bitcoinj:bitcoinj-core:0.17.1'
}
